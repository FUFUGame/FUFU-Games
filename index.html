const LOST_GUARD_URL = "https://docs.qq.com/doc/DS3JaeU9CVWpDVmhH";

//弹窗dom
const donateModal = document.getElementById("donateModal");
const modalQrcode = document.getElementById("modalQrcode");
const modalClose = document.getElementById("modalClose");
const btnWechat = document.getElementById("btnWechat");
const btnAlipay = document.getElementById("btnAlipay");
const btnLostGuard = document.getElementById("btnLostGuard");

function openQr(src){
  modalQrcode.src = src;
  donateModal.classList.remove("hidden");
  document.body.style.overflow = "hidden";
}
function closeQr(){
  donateModal.classList.add("hidden");
  document.body.style.overflow = "";
}
btnWechat.addEventListener("click",()=>openQr(QR.wechat));
btnAlipay.addEventListener("click",()=>openQr(QR.alipay));
//防走丢按钮点击事件，新标签页打开链接
btnLostGuard.addEventListener("click",()=>{
  window.open(LOST_GUARD_URL,"_blank");
});

modalClose.addEventListener("click",closeQr);
donateModal.addEventListener("click",(e)=>{
  if(e.target === donateModal) closeQr();
})
document.addEventListener("keydown",(e)=>{
  if(e.key === "Escape" && !donateModal.classList.contains("hidden")) closeQr();
})

const perPage = 20;
let currentPage = 1;
let gameList = [...allGames];
let activeCat = "";
//获取url参数
function getUrlParam(name){
  const u = new URL(window.location.href);
  return u.searchParams.get(name);
}
//渲染列表
function renderList(page){
  const wrap = document.getElementById("gameWrap");
  const tips = document.getElementById("tips");
  const tipText = document.getElementById("searchTipText");
  if(gameList.length<=0){
    wrap.innerHTML = "<div class='col-span-full text-center py-10 text-gray-500'>没有找到匹配游戏</div>";
    tips.classList.remove("hidden");
    tipText.textContent = "未找到游戏";
    document.getElementById("pagination").innerHTML="";
    return;
  }
  const start = (page-1)*perPage;
  const end = start + perPage;
  const pageData = gameList.slice(start,end);
  let html = "";
  pageData.forEach(item=>{
    html += `
    <div class="bg-white rounded-lg overflow-hidden card-shadow card-hover" data-gid="${item.gid}" data-cat="${item.cat}">
      <img src="${item.img}" class="w-full h-40 object-cover">
      <div class="p-3 text-center">
        <div class="text-sm font-medium">${item.cn}</div>
        <div class="text-xs text-gray-400 mt-1">${item.en}</div>
      </div>
    </div>
    `
  })
  wrap.innerHTML = html;
  document.querySelectorAll("#gameWrap > div").forEach(card=>{
      card.addEventListener("click",()=>{
        const gid = card.dataset.gid;
        const cat = card.dataset.cat;
        // 新标签页打开详情页
        const targetUrl = `detail.html?gid=${gid}&cat=${encodeURIComponent(cat)}`;
        window.open(targetUrl,"_blank");
      })
    })
}
//渲染分页
function renderPagination(page){
  const total = Math.ceil(gameList.length / perPage);
  const pWrap = document.getElementById("pagination");
  if(total <=1){
    pWrap.innerHTML="";
    return;
  }
  let pHtml = "";
  pHtml += `<span class="page-item ${page===1?'page-active':''}" data-p="1">首</span>`;
  let showStart = Math.max(1, page - 2);
  let showEnd = Math.min(total, showStart +4);
  for(let i=showStart;i<=showEnd;i++){
    pHtml += `<span class="page-item ${i===page?'page-active':''}" data-p="${i}">${i}</span>`
  }
  pHtml += `<span class="page-item ${page===total?'page-active':''}" data-p="${total}">末</span>`;
  pWrap.innerHTML = pHtml;
  pWrap.querySelectorAll(".page-item").forEach(el=>{
    el.addEventListener("click",()=>{
      const go = Number(el.dataset.p);
      if(go!==currentPage){
        currentPage = go;
        renderList(currentPage);
        renderPagination(currentPage);
        window.scrollTo({top:0,behavior:"smooth"})
      }
    })
  })
}
function resetHome(){
  const searchInput = document.getElementById("searchInput");
  searchInput.value = "";
  activeCat = "";
  gameList = [...allGames];
  currentPage = 1;
  document.querySelectorAll(".cat-item").forEach(c=>c.classList.remove("cat-active"));
  document.querySelector('.cat-item[data-cat=""]').classList.add("cat-active");
  document.getElementById("tips").classList.add("hidden");
  renderList(currentPage);
  renderPagination(currentPage);
  window.scrollTo({top:0,behavior:"smooth"});
}
function doSearch(){
  const kw = searchInput.value.trim().toLowerCase();
  const tips = document.getElementById("tips");
  const tipText = document.getElementById("searchTipText");
  if(!kw){
    resetHome();
    return;
  }
  gameList = allGames.filter(g=> g.cn.toLowerCase().includes(kw) || g.en.toLowerCase().includes(kw));
  currentPage=1;
  tips.classList.remove("hidden");
  tipText.textContent = `搜索关键词：「${searchInput.value.trim()}」，共找到 ${gameList.length} 条结果`;
  renderList(currentPage);
  renderPagination(currentPage);
}
//分类点击
function bindCategory(){
  const wrap = document.getElementById("categoryWrap");
  wrap.querySelectorAll(".cat-item").forEach(el=>{
    el.addEventListener("click",()=>{
      activeCat = el.dataset.cat;
      wrap.querySelectorAll(".cat-item").forEach(c=>c.classList.remove("cat-active"));
      el.classList.add("cat-active");
      if(activeCat === ""){
        gameList = [...allGames];
      }else{
        gameList = allGames.filter(g=>g.cat === activeCat);
      }
      currentPage = 1;
      document.getElementById("tips").classList.add("hidden");
      renderList(currentPage);
      renderPagination(currentPage);
      window.scrollTo({top:0,behavior:"smooth"});
    })
  })
}
//读取url里的cat参数，页面加载自动选中分类
function loadCatFromUrl(){
  const urlCat = getUrlParam("cat");
  if(!urlCat) return;
  activeCat = urlCat;
  const wrap = document.getElementById("categoryWrap");
  wrap.querySelectorAll(".cat-item").forEach(c=>c.classList.remove("cat-active"));
  const targetCatEl = document.querySelector(`.cat-item[data-cat="${activeCat}"]`);
  if(targetCatEl){
    targetCatEl.classList.add("cat-active");
  }
  gameList = allGames.filter(g=>g.cat === activeCat);
  currentPage = 1;
  renderList(currentPage);
  renderPagination(currentPage);
}
//初始化执行
renderList(currentPage);
renderPagination(currentPage);
bindCategory();
loadCatFromUrl();
const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const backHomeBtn = document.getElementById("backHomeBtn");
searchBtn.addEventListener("click",doSearch);
searchInput.addEventListener("keydown",function(e){
  if(e.key==="Enter") doSearch();
})
backHomeBtn.addEventListener("click",resetHome);
</script>
