//=========夜间模式=========
const btnNightMode = document.getElementById("btnNightMode");
const nightIcon = document.getElementById("nightIcon");
function applyNightMode(on){
  document.body.classList.toggle("dark", on);
  nightIcon.className = on ? "fa fa-sun-o" : "fa fa-moon-o";
  btnNightMode.title = on ? "切换到日间模式" : "切换到夜间模式";
  try{ localStorage.setItem("night-mode", on ? "1" : "0"); }catch(e){}
}
let nightOn = false;
try{ nightOn = localStorage.getItem("night-mode") === "1"; }catch(e){}
applyNightMode(nightOn);
btnNightMode.addEventListener("click", function(){
  applyNightMode(!document.body.classList.contains("dark"));
});
//=========二维码图片地址=========
const QR = {
  wechat: "images/微信.jpg",
  alipay: "images/支付宝.jpg"
};
// =========防走丢跳转链接，修改这里为你的目标地址=========

//弹窗dom
const donateModal = document.getElementById("donateModal");
const modalQrcode = document.getElementById("modalQrcode");
const modalClose = document.getElementById("modalClose");
const btnWechat = document.getElementById("btnWechat");
const btnAlipay = document.getElementById("btnAlipay");
const btnLostGuard = document.getElementById("btnLostGuard");
function openQr(src){
  modalQrcode.src = src;
  donateModal.classList.remove("hidden");
  document.body.style.overflow = "hidden";
}
function closeQr(){
  donateModal.classList.add("hidden");
  document.body.style.overflow = "";
}
btnWechat.addEventListener("click",()=>openQr(QR.wechat));
btnAlipay.addEventListener("click",()=>openQr(QR.alipay));
//防走丢按钮点击事件，新标签页打开链接
btnLostGuard.addEventListener("click",()=>{
  window.open(LOST_GUARD_URL,"_blank");
});
modalClose.addEventListener("click",closeQr);
donateModal.addEventListener("click",(e)=>{
  if(e.target === donateModal) closeQr();
})
document.addEventListener("keydown",(e)=>{
  if(e.key === "Escape" && !donateModal.classList.contains("hidden")) closeQr();
})

  {gid:"35",cn:"禁闭求生2 单机+联机",en:"Grounded 2",img:"https://shared.st.dl.eccdnx.com/store_item_assets/steam/apps/2661300/b52405d3dd3d4bfd356cd9af7b399bcbc5a23f7e/header.jpg?t=1787010637",cat:"动作冒险",version:"v0.5.0.5"},
  {gid:"36",cn:"雪地奔驰",en:"SnowRunner",img:"https://shared.st.dl.eccdnx.com/store_item_assets/steam/apps/1465360/header.jpg?t=1788339013",cat:"模拟经营",version:"v20260903"},
  {gid:"37",cn:"最后的守护者",en:"The Last Caretaker",img:"https://shared.st.dl.eccdnx.com/store_item_assets/steam/apps/1783560/684058b57eeffd521d8b5f94a026c9218ce74e58/header.jpg?t=1788262247",cat:"动作冒险",version:"v0.8.5.651027"}
];
const perPage = 20;
let currentPage = 1;
let gameList = [...allGames];
let activeCat = "";
//获取url参数
function getUrlParam(name){
  const u = new URL(window.location.href);
  return u.searchParams.get(name);
}
// 更新浏览器url，pushState不刷新页面，保存cat和page
function updateUrlState(){
  const url = new URL(window.location.href);
  if(activeCat){
    url.searchParams.set("cat", activeCat);
  }else{
    url.searchParams.delete("cat");
  }
  if(currentPage>1){
    url.searchParams.set("page", currentPage);
  }else{
    url.searchParams.delete("page");
  }
  history.pushState(null, "", url.toString());
}
//渲染列表
function renderList(page){
  const wrap = document.getElementById("gameWrap");
  const tips = document.getElementById("tips");
  const tipText = document.getElementById("searchTipText");
  if(gameList.length<=0){
    wrap.innerHTML = "<div class='col-span-full text-center py-10 text-gray-500'>没有找到匹配游戏</div>";
    tips.classList.remove("hidden");
    tipText.textContent = "未找到游戏";
    document.getElementById("pagination").innerHTML="";
    return;
  }
  const start = (page-1)*perPage;
  const end = start + perPage;
  const pageData = gameList.slice(start,end);
  let html = "";
  pageData.forEach(item=>{
    // version不为空字符串才渲染标签
    const versionHtml = item.version ? `<div class="version-tag">${item.version}</div>` : "";
    html += `
    <div class="bg-white rounded-lg overflow-hidden card-shadow card-hover relative group" data-gid="${item.gid}" data-cat="${item.cat}">
      ${versionHtml}
      <img src="${item.img}" class="w-full h-40 object-cover">
      <div class="p-3 text-center">
        <div class="text-sm font-medium">${item.cn}</div>
        <div class="text-xs text-gray-400 mt-1">${item.en}</div>
      </div>
    </div>
    `
  })
  wrap.innerHTML = html;
  document.querySelectorAll("#gameWrap > div").forEach(card=>{
      card.addEventListener("click",()=>{
        const gid = card.dataset.gid;
        const cat = card.dataset.cat;
        // 新标签页打开详情页
        const targetUrl = `detail.html?gid=${gid}&cat=${encodeURIComponent(cat)}`;
        window.open(targetUrl,"_blank");
      })
    })
}
//渲染分页
function renderPagination(page){
  const total = Math.ceil(gameList.length / perPage);
  const pWrap = document.getElementById("pagination");
  if(total <=1){
    pWrap.innerHTML="";
    return;
  }
  let pHtml = "";
  pHtml += `<span class="page-item ${page===1?'page-active':''}" data-p="1">首</span>`;
  let showStart = Math.max(1, page - 4);
  let showEnd = Math.min(total, showStart +8);
  for(let i=showStart;i<=showEnd;i++){
    pHtml += `<span class="page-item ${i===page?'page-active':''}" data-p="${i}">${i}</span>`;
  }
  pHtml += `<span class="page-item ${page===total?'page-active':''}" data-p="${total}">末</span>`;
  pWrap.innerHTML = pHtml;
  pWrap.querySelectorAll(".page-item").forEach(el=>{
    el.addEventListener("click",()=>{
      const go = Number(el.dataset.p);
      if(go!==currentPage){
        currentPage = go;
        updateUrlState(); //切换页码更新url
        renderList(currentPage);
        renderPagination(currentPage);
        window.scrollTo({top:0,behavior:"smooth"})
      }
    })
  })
}
function resetHome(){
  const searchInput = document.getElementById("searchInput");
  searchInput.value = "";
  activeCat = "";
  gameList = [...allGames];
  currentPage = 1;
  document.querySelectorAll(".cat-item").forEach(c=>c.classList.remove("cat-active"));
  document.querySelector('.cat-item[data-cat=""]').classList.add("cat-active");
  document.getElementById("tips").classList.add("hidden");
  updateUrlState();
  renderList(currentPage);
  renderPagination(currentPage);
  window.scrollTo({top:0,behavior:"smooth"});
}
function doSearch(){
  const kw = searchInput.value.trim().toLowerCase();
  const tips = document.getElementById("tips");
  const tipText = document.getElementById("searchTipText");
  if(!kw){
    resetHome();
    return;
  }
  gameList = allGames.filter(g=> g.cn.toLowerCase().includes(kw) || g.en.toLowerCase().includes(kw));
  currentPage=1;
  tips.classList.remove("hidden");
  tipText.textContent = `搜索关键词：「${searchInput.value.trim()}」，共找到 ${gameList.length} 条结果`;
  renderList(currentPage);
  renderPagination(currentPage);
}
//分类点击
function bindCategory(){
  const wrap = document.getElementById("categoryWrap");
  wrap.querySelectorAll(".cat-item").forEach(el=>{
    el.addEventListener("click",()=>{
      activeCat = el.dataset.cat;
      wrap.querySelectorAll(".cat-item").forEach(c=>c.classList.remove("cat-active"));
      el.classList.add("cat-active");
      if(activeCat === ""){
        gameList = [...allGames];
      }else{
        gameList = allGames.filter(g=>g.cat === activeCat);
      }
      currentPage = 1;
      document.getElementById("tips").classList.add("hidden");
      updateUrlState(); //切换分类更新url
      renderList(currentPage);
      renderPagination(currentPage);
      window.scrollTo({top:0,behavior:"smooth"});
    })
  })
}
//读取url里的cat、page参数，页面刷新自动恢复状态
function loadStateFromUrl(){
  const urlCat = getUrlParam("cat");
  const urlPageRaw = getUrlParam("page");
  let urlPage = Number(urlPageRaw) || 1;
  //恢复分类
  activeCat = urlCat || "";
  const wrap = document.getElementById("categoryWrap");
  wrap.querySelectorAll(".cat-item").forEach(c=>c.classList.remove("cat-active"));
  const targetCatEl = document.querySelector(`.cat-item[data-cat="${activeCat}"]`);
  if(targetCatEl){
    targetCatEl.classList.add("cat-active");
  }
  //过滤游戏列表
  if(activeCat){
    gameList = allGames.filter(g=>g.cat === activeCat);
  }else{
    gameList = [...allGames];
  }
  //校验页码，不能超出范围
  const totalPage = Math.ceil(gameList.length / perPage);
  if(urlPage <1) urlPage = 1;
  if(urlPage>totalPage && totalPage>0) urlPage = totalPage;
  currentPage = urlPage;
}
//监听浏览器前进后退按钮，恢复页面状态
window.addEventListener("popstate", function(){
  loadStateFromUrl();
  renderList(currentPage);
  renderPagination(currentPage);
})
//初始化执行
loadStateFromUrl();
renderList(currentPage);
renderPagination(currentPage);
bindCategory();
const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const backHomeBtn = document.getElementById("backHomeBtn");
searchBtn.addEventListener("click",doSearch);
searchInput.addEventListener("keydown",function(e){
  if(e.key==="Enter") doSearch();
})
backHomeBtn.addEventListener("click",resetHome);
</script>
</body>
</html>
