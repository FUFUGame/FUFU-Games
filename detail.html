          }

<!-- 截图预览弹窗 -->
<div id="imgPreviewModal" class="fixed inset-0 bg-black/85 hidden flex flex-col items-center justify-center p-4">

  <button id="btnPrev" class="absolute left-3 top-1/2 -translate-y-1/2 text-white text-5xl bg-black/40 w-12 h-12 rounded-full flex items-center justify-center cursor-pointer hover:bg-black/70 disabled:opacity-20 disabled:cursor-default">❮</button>

  <div id="pageInfo" class="mt-3 text-white text-lg"></div>

  </div>
</div>

  const qrModalClose = document.getElementById("qrModalClose");
  let currentToolData = null; //保存工具页面数据，用于事件委托读取二维码地址
  function openNetdiskQr(src){
    netdiskQrcodeImg.src = src;
    netdiskQrModal.classList.remove("hidden");
    document.body.style.overflow = "hidden";
  }
  function closeNetdiskQr(){
    netdiskQrModal.classList.add("hidden");
    netdiskQrcodeImg.src = "";
    document.body.style.overflow = "";
  }
  //截图预览弹窗
  const imgPreviewModal = document.getElementById('imgPreviewModal');
  const previewImg = document.getElementById('previewImg');
  const previewClose = document.getElementById('previewClose');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const pageInfo = document.getElementById('pageInfo');
  let shotList = [];
  let currentIndex = 0;
  function refreshPreview(){
    previewImg.src = shotList[currentIndex];
    pageInfo.innerText = `${currentIndex+1} / ${shotList.length}`;
    btnPrev.disabled = currentIndex <= 0;
    btnNext.disabled = currentIndex >= shotList.length -1;
  }
  function openImgPreview(startIndex, imagesArr){
    shotList = [...imagesArr];
    currentIndex = startIndex;
    refreshPreview();
    imgPreviewModal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }
  function closeImgPreview(){
    imgPreviewModal.classList.add('hidden');
    previewImg.src = '';
    document.body.style.overflow = '';
    shotList = [];
    currentIndex = 0;
  }
  function goPrev(){
    if(currentIndex > 0){ currentIndex--; refreshPreview(); }
  }
  function goNext(){
    if(currentIndex < shotList.length -1){ currentIndex++; refreshPreview(); }
  }
  previewClose.addEventListener('click', closeImgPreview);
  btnPrev.addEventListener('click', goPrev);
  btnNext.addEventListener('click', goNext);
  imgPreviewModal.addEventListener('click', e=>{
    if(e.target === imgPreviewModal) closeImgPreview();
  })
  //ESC按键
  document.addEventListener('keydown',function(e){
    if(e.key === 'Escape'){
      !imgPreviewModal.classList.contains('hidden') && closeImgPreview();
      !netdiskQrModal.classList.contains('hidden') && closeNetdiskQr();
    }
    if(!imgPreviewModal.classList.contains('hidden')){

  function getUrlParam(name){
    const u = new URL(window.location.href);
    return u.searchParams.get(name);
  }
  const gid = getUrlParam("gid");
  const cat = getUrlParam("cat");
  const data = gameDB[gid];
  if(!data){
    document.title = "页面不存在";
    document.body.innerHTML = `<div class="p-10 text-center"><h2>页面不存在</h2><a href="index.html">返回首页</a></div>`;
    return;
  }
  // 使用gameDB内游戏name设置浏览器标签标题
  document.title = data.name;
  //dom
  const toolLayout = document.getElementById('toolLayout');
  const gameLayout = document.getElementById('gameLayout');
  const breadWrap = document.getElementById("breadWrap");
  //面包屑
  let breadHtml = `<a href="index.html" class="text-blue-600">主页</a>`;
  if(cat){
    breadHtml += ` <span> › </span> <a href="index.html?cat=${encodeURIComponent(cat)}" class="text-blue-600">${cat}</a>`;
  }
  breadHtml += ` <span> › </span> <span>${data.name}</span>`;
  breadWrap.innerHTML = breadHtml;
  if(data.isTool){
    //渲染工具页面，隐藏游戏布局
    toolLayout.classList.remove('hidden');
    gameLayout.classList.add('hidden');
    currentToolData = data; //保存工具数据给委托事件使用
    document.getElementById('toolRuntimeDesc').innerText = data.runtimeDesc;
    document.getElementById('toolUnzipDesc').innerText = data.unzipDesc;
  }else{
    //普通游戏页面
    toolLayout.classList.add('hidden');
    gameLayout.classList.remove('hidden');
    currentToolData = null;
    const btnBaiduQr = document.getElementById("btnBaiduQr");
    const btnQuarkQr = document.getElementById("btnQuarkQr");
    btnBaiduQr.addEventListener("click", ()=>openNetdiskQr(data.baiduQr));
    btnQuarkQr.addEventListener("click", ()=>openNetdiskQr(data.quarkQr));
    document.getElementById("detailTitle").innerText = data.name;
    document.getElementById("detailEng").innerText = data.eng;
    document.getElementById("detailCover").src = data.cover;
    document.getElementById("detailUpdate").innerText = data.update;
    document.getElementById("detailVersion").innerText = data.version;
    document.getElementById("linkSteam").href = data.steam;
    document.getElementById("linkSteam").innerText = data.steam;
    document.getElementById("detailDesc").innerText = data.desc;
    //渲染截图
    let shotHtml = "";
    data.shots.forEach((s,idx)=>{
      shotHtml += `<img src="${s}" class="screenshot-img rounded w-full" data-idx="${idx}">`
    })
    document.getElementById("shotWrap").innerHTML = shotHtml;
    document.querySelectorAll('.screenshot-img').forEach(img=>{
      img.onclick = function(){
        const idx = Number(this.dataset.idx);
        openImgPreview(idx, data.shots);
      }
    })
  }
  //====事件委托：工具页面按钮点击，修复hidden容器绑定失效问题====
  document.body.addEventListener('click',function(e){
    if(e.target.classList.contains('tool-qr-btn') && currentToolData){
      const qrKey = e.target.dataset.qr;
      openNetdiskQr(currentToolData[qrKey]);
    }
  })
  qrModalClose.addEventListener("click", closeNetdiskQr);
  netdiskQrModal.addEventListener("click", e=>{
    if(e.target === netdiskQrModal) closeNetdiskQr();
  })
})
</script>
