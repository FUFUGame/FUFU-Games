<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏详情</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:'#9333ea'
          }
        }
      }
    }
  </script>
  <style>
    .screenshot-img{
      transition:0.2s;
      cursor: zoom-in;
    }
    .screenshot-img:hover{
      transform:scale(1.02);
    }
    #imgPreviewModal,#netdiskQrModal{
      z-index:9999;
    }
    #previewImg{
      max-width:92vw;
      max-height:86vh;
    }
  </style>
</head>
<body class="bg-gray-100">
<!-- 截图预览弹窗 -->
<div id="imgPreviewModal" class="fixed inset-0 bg-black/85 hidden flex flex-col items-center justify-center p-4">
  <button id="previewClose" class="absolute top-4 right-4 text-white text-4xl bg-transparent border-none cursor-pointer z-10">&times;</button>
  <button id="btnPrev" class="absolute left-3 top-1/2 -translate-y-1/2 text-white text-5xl bg-black/40 w-12 h-12 rounded-full flex items-center justify-center cursor-pointer hover:bg-black/70 disabled:opacity-20 disabled:cursor-default">❮</button>
  <button id="btnNext" class="absolute right-3 top-1/2 -translate-y-1/2 text-white text-5xl bg-black/40 w-12 h-12 rounded-full flex items-center justify-center cursor-pointer hover:bg-black/70 disabled:opacity-20 disabled:cursor-default">❯</button>
  <img id="previewImg" src="" alt="大图预览" class="rounded shadow-2xl">
  <div id="pageInfo" class="mt-3 text-white text-lg"></div>
</div>
<!-- 网盘二维码弹窗【修改为固定标题+提示文字+图片结构】 -->
<div id="netdiskQrModal" class="fixed inset-0 z-[9999] bg-black/75 hidden flex items-center justify-center p-4">
  <div class="relative bg-white p-6 rounded-lg shadow-xl max-w-sm w-full">
    <button id="qrModalClose" class="absolute -top-3 -right-3 w-8 h-8 rounded-full bg-white text-gray-800 shadow-lg text-xl">×</button>
    <h3 class="text-xl font-bold text-center mb-2">手机扫码保存资源</h3>
    <p class="text-gray-500 text-sm text-center mb-4">请用网盘App扫码保存，再用电脑下载</p>
    <img id="netdiskQrcodeImg" src="" alt="网盘二维码" class="w-full rounded">
  </div>
</div>
<div class="max-w-5xl mx-auto px-3 py-6">
  <!--面包屑导航 -->
  <div class="text-sm text-gray-500 mb-4" id="breadWrap">
  </div>
  <div class="bg-white p-6 rounded shadow">
    <div class="flex flex-col md:flex-row gap-6">
      <div class="md:w-1/3">
        <img id="detailCover" src="" class="w-full rounded">
      </div>
      <div class="md:w-2/3">
        <h1 id="detailTitle" class="text-2xl font-bold mb-3"></h1>
        <div class="text-sm text-gray-600 space-y-1">
          <p>英文名：<span id="detailEng"></span></p>
          <p>发行日期：<span id="detailUpdate"></span></p>
          <p>版本：<span id="detailVersion"></span></p>
        </div>
        <div class="flex flex-wrap gap-2 mt-4" id="tagWrap"></div>
      </div>
    </div>
    <hr class="my-6">
    <div class="mb-6">
      <h2 class="text-lg font-bold border-l-4 border-primary pl-2 mb-3">游戏介绍</h2>
      <div id="detailDesc" class="text-gray-700 leading-relaxed"></div>
    </div>
    <div class="mb-6">
      <h2 class="text-lg font-bold border-l-4 border-primary pl-2 mb-3">游戏截图</h2>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-3" id="shotWrap"></div>
    </div>
    <!-- Steam独立分区 -->
    <div class="bg-blue-50 p-4 rounded border mb-4">
      <h2 class="text-lg font-bold mb-2">🔗 官方商店</h2>
      <p>Steam官网：<a id="linkSteam" target="_blank" class="text-blue-600 underline"></a></p>
    </div>
    <!-- 资源下载 -->
    <div class="bg-gray-50 p-4 rounded border">
      <h2 class="text-lg font-bold mb-3">📥资源下载</h2>
      <div class="flex flex-wrap gap-3 mt-2">
        <button id="btnBaiduQr" class="px-4 py-2 bg-blue-500 text-white rounded">百度网盘</button>
        <button id="btnQuarkQr" class="px-4 py-2 bg-blue-500 text-white rounded">夸克网盘</button>
      </div>
    </div>
    <div class="mt-6">
      <a href="index.html" class="inline-block px-4 py-2 bg-primary text-white rounded">← 返回主页</a>
    </div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  // 网盘弹窗
  const netdiskQrModal = document.getElementById("netdiskQrModal");
  const netdiskQrcodeImg = document.getElementById("netdiskQrcodeImg");
  const qrModalClose = document.getElementById("qrModalClose");
  const btnBaiduQr = document.getElementById("btnBaiduQr");
  const btnQuarkQr = document.getElementById("btnQuarkQr");
  function openNetdiskQr(src){
    netdiskQrcodeImg.src = src;
    netdiskQrModal.classList.remove("hidden");
    document.body.style.overflow = "hidden";
  }
  function closeNetdiskQr(){
    netdiskQrModal.classList.add("hidden");
    netdiskQrcodeImg.src = "";
    document.body.style.overflow = "";
  }
  //截图预览弹窗
  const imgPreviewModal = document.getElementById('imgPreviewModal');
  const previewImg = document.getElementById('previewImg');
  const previewClose = document.getElementById('previewClose');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const pageInfo = document.getElementById('pageInfo');
  let shotList = [];
  let currentIndex = 0;
  function refreshPreview(){
    previewImg.src = shotList[currentIndex];
    pageInfo.innerText = `${currentIndex+1} / ${shotList.length}`;
    btnPrev.disabled = currentIndex <= 0;
    btnNext.disabled = currentIndex >= shotList.length -1;
  }
  function openImgPreview(startIndex, imagesArr){
    shotList = [...imagesArr];
    currentIndex = startIndex;
    refreshPreview();
    imgPreviewModal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }
  function closeImgPreview(){
    imgPreviewModal.classList.add('hidden');
    previewImg.src = '';
    document.body.style.overflow = '';
    shotList = [];
    currentIndex = 0;
  }
  function goPrev(){
    if(currentIndex > 0){ currentIndex--; refreshPreview(); }
  }
  function goNext(){
    if(currentIndex < shotList.length -1){ currentIndex++; refreshPreview(); }
  }
  previewClose.addEventListener('click', closeImgPreview);
  btnPrev.addEventListener('click', goPrev);
  btnNext.addEventListener('click', goNext);
  imgPreviewModal.addEventListener('click', e=>{
    if(e.target === imgPreviewModal) closeImgPreview();
  })
  //ESC按键
  document.addEventListener('keydown',function(e){
    if(e.key === 'Escape'){
      !imgPreviewModal.classList.contains('hidden') && closeImgPreview();
      !netdiskQrModal.classList.contains('hidden') && closeNetdiskQr();
    }
    if(!imgPreviewModal.classList.contains('hidden')){
      if(e.key === 'ArrowLeft') goPrev();
      if(e.key === 'ArrowRight') goNext();
    }
  })
  //游戏数据库 baiduQr、quarkQr为二维码图片路径
  const gameDB = {
    "1":{
      name:"轮回之兽",
      eng:"Beast of Reincarnation",
      cover:"images/轮回之兽.jpg",
      update:"2026‑08‑04",
      version:"v1.0.10.0",
      desc:"Game Freak 诚意新作：《轮回之兽》是一款融合了即时与回合制战斗的动作角色扮演游戏。在美丽而又严酷的《轮回之兽》世界中，享受创新的“一人一狗协作动作角色扮演”体验。在艾玛和小库的旅程终点会有什么在等待着他们呢？",
      shots:[
        "images/轮回之兽1.jpg",
        "images/轮回之兽2.jpg",
        "images/轮回之兽3.jpg",
        "images/轮回之兽4.jpg",
        "images/轮回之兽5.jpg",
        "images/轮回之兽6.jpg"
      ],
      baiduQr:"images/轮回之兽百度.png",
      quarkQr:"images/quark_qr_1.png",
      steam:"https://store.steampowered.com/app/2001760"
    },
    "2":{
      name:"龙之信条2",
      eng:"Dragon's Dogma 2",
      cover:"https://picsum.photos/id/12/600/400",
      update:"2024‑03‑22",
      version:"v1.0.1",
      desc:"《龙之信条2》是一款奇幻题材开放世界动作角色扮演游戏，玩家作为觉醒者踏上屠龙的冒险旅途。本作最具特色的随从AI系统能够让队友自主进行战斗、探路、拾取道具，高自由度的职业搭配与立体式战斗带来丰富玩法。庞大的奇幻大陆分布着城镇、密林、洞窟与巨型怪物，昼夜循环和动态事件让整个世界充满生机。",
      shots:[
        "https://picsum.photos/id/12/800/450",
        "https://picsum.photos/id/13/800/450",
        "https://picsum.photos/id/14/800/450"
      ],
      baiduQr:"images/baidu_qr_2.png",
      quarkQr:"images/quark_qr_2.png",
      steam:"https://store.steampowered.com/app/demo002"
    },
    "3":{
      name:"怪物猎人：荒野",
      eng:"Monster Hunter Wilds",
      cover:"https://picsum.photos/id/13/600/400",
      update:"2025‑02‑28",
      version:"v1.0.3",
      desc:"《怪物猎人：荒野》是经典狩猎系列全新续作，游戏打造出广阔且生态逼真的荒野环境，多种巨型怪物拥有独特的行为模式与攻击特点。玩家可以挑选不同武器，搭配装备与道具进行狩猎，支持多人组队协作。环境会随天气与季节发生变化，怪物之间存在捕食争斗，真实的生态系统给狩猎带来更多变数与挑战。",
      shots:[
        "https://picsum.photos/id/13/800/450",
        "https://picsum.photos/id/14/800/450",
        "https://picsum.photos/id/21/800/450"
      ],
      baiduQr:"images/baidu_qr_3.png",
      quarkQr:"images/quark_qr_3.png",
      steam:"https://store.steampowered.com/app/demo003"
    },
    "5":{
      name:"黑神话：悟空",
      eng:"Black Myth: Wukong",
      cover:"https://picsum.photos/id/21/600/400",
      update:"2024‑08‑20",
      version:"v1.0.4",
      desc:"《黑神话：悟空》取材于古典名著西游记，是一款国产第三人称动作角色扮演游戏。玩家将踏上充满妖魔鬼怪的西行之路，依靠身法、法术与棍法迎战各路妖王。游戏画面精良，场景氛围感浓厚，拥有多种变身技能，战斗手感扎实，融合东方神话美学，打造出一个苍凉诡谲的西游世界。",
      shots:[
        "https://picsum.photos/id/21/800/450",
        "https://picsum.photos/id/22/800/450",
        "https://picsum.photos/id/23/800/450"
      ],
      baiduQr:"images/baidu_qr_5.png",
      quarkQr:"images/quark_qr_5.png",
      steam:"https://store.steampowered.com/app/demo005"
    }
  };
  function getUrlParam(name){
    const u = new URL(window.location.href);
    return u.searchParams.get(name);
  }
  const gid = getUrlParam("gid");
  const cat = getUrlParam("cat");
  const data = gameDB[gid];
  if(!data){
    document.body.innerHTML = `<div class="p-10 text-center"><h2>游戏不存在</h2><a href="index.html">返回首页</a></div>`;
    return;
  }
  btnBaiduQr.addEventListener("click", ()=>openNetdiskQr(data.baiduQr));
  btnQuarkQr.addEventListener("click", ()=>openNetdiskQr(data.quarkQr));
  qrModalClose.addEventListener("click", closeNetdiskQr);
  netdiskQrModal.addEventListener("click", e=>{
    if(e.target === netdiskQrModal) closeNetdiskQr();
  })

  //面包屑渲染
  const breadWrap = document.getElementById("breadWrap");
  let breadHtml = `<a href="index.html" class="text-blue-600">主页</a>`;
  if(cat){
    breadHtml += ` <span> › </span> <a href="index.html?cat=${encodeURIComponent(cat)}" class="text-blue-600">${cat}</a>`;
  }
  breadHtml += ` <span> › </span> <span>${data.name}</span>`;
  breadWrap.innerHTML = breadHtml;

  document.getElementById("detailTitle").innerText = data.name;
  document.getElementById("detailEng").innerText = data.eng;
  document.getElementById("detailCover").src = data.cover;
  document.getElementById("detailUpdate").innerText = data.update;
  document.getElementById("detailVersion").innerText = data.version;
  document.getElementById("linkSteam").href = data.steam;
  document.getElementById("linkSteam").innerText = data.steam;
  document.getElementById("detailDesc").innerText = data.desc;
  //渲染截图
  let shotHtml = "";
  data.shots.forEach((s,idx)=>{
    shotHtml += `<img src="${s}" class="screenshot-img rounded w-full" data-idx="${idx}">`
  })
  document.getElementById("shotWrap").innerHTML = shotHtml;
  document.querySelectorAll('.screenshot-img').forEach(img=>{
    img.onclick = function(){
      const idx = Number(this.dataset.idx);
      openImgPreview(idx, data.shots);
    }
  })
})
</script>
</body>
</html>
