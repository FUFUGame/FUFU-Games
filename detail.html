<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏详情</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:'#9333ea'
          }
        }
      }
    }
  </script>
  <style>
    .screenshot-img{
      transition:0.2s;
    }
    .screenshot-img:hover{
      transform:scale(1.02);
    }
  </style>
</head>
<body class="bg-gray-100">
<div class="max-w-5xl mx-auto px-3 py-6">
  <!--面包屑导航 修改后：主页 › 游戏名称 -->
  <div class="text-sm text-gray-500 mb-4">
    <a href="index.html" class="text-blue-600">主页</a>
    <span> › </span>
    <span id="breadName">游戏名称</span>
  </div>

  <div class="bg-white p-6 rounded shadow">
    <div class="flex flex-col md:flex-row gap-6">
      <!--左侧封面-->
      <div class="md:w-1/3">
        <img id="detailCover" src="" class="w-full rounded">
      </div>
      <!--右侧基础信息，字段全部替换-->
      <div class="md:w-2/3">
        <h1 id="detailTitle" class="text-2xl font-bold mb-3"></h1>
        <div class="text-sm text-gray-600 space-y-1">
          <p>英文名：<span id="detailEng"></span></p>
          <p>发行日期：<span id="detailUpdate"></span></p>
          <p>版本：<span id="detailVersion"></span></p>
        </div>
        <!--标签-->
        <div class="flex flex-wrap gap-2 mt-4" id="tagWrap">
        </div>
      </div>
    </div>

    <hr class="my-6">

    <!--游戏介绍，增加完整文字内容-->
    <div class="mb-6">
      <h2 class="text-lg font-bold border-l-4 border-primary pl-2 mb-3">游戏介绍</h2>
      <div id="detailDesc" class="text-gray-700 leading-relaxed"></div>
    </div>

    <!--游戏截图-->
    <div class="mb-6">
      <h2 class="text-lg font-bold border-l-4 border-primary pl-2 mb-3">游戏截图</h2>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-3" id="shotWrap">
      </div>
    </div>

    <!--下载区域，改为3行链接，删除提取码-->
    <div class="bg-gray-50 p-4 rounded border">
      <h2 class="text-lg font-bold mb-3">📥资源下载</h2>
      <p class="mb-2">🔗百度网盘：<a id="linkBaidu" target="_blank" class="text-blue-600 underline"></a></p>
      <p class="mb-2">🔗夸克网盘：<a id="linkQuark" target="_blank" class="text-blue-600 underline"></a></p>
      <p class="mb-2">🔗Steam官网：<a id="linkSteam" target="_blank" class="text-blue-600 underline"></a></p>
    </div>

    <div class="mt-6">
      <a href="index.html" class="inline-block px-4 py-2 bg-primary text-white rounded">← 返回主页</a>
    </div>
  </div>
</div>

<script>
const gameDB = {
  "1":{
    name:"幽灵行动：荒野",
    eng:"Ghost Recon Wildlands",
    cover:"https://picsum.photos/id/11/600/400",
    update:"2017‑03‑07",
    version:"v1.0.0",
    tags:["#战术","#开放世界","#射击","#合作"],
    desc:"《幽灵行动：荒野》是一款开放世界战术射击游戏，玩家将化身精英特种部队成员，深入广袤的玻利维亚荒野，瓦解庞大的贩毒集团。游戏拥有超大可自由探索地图，支持单人潜行攻坚或者最多四人联机协同作战，战术选择丰富，可以远距离狙击、近距离突击或者利用载具完成机动穿插，多变的地形与昼夜天气系统进一步提升了游戏的沉浸感。",
    shots:[
      "https://picsum.photos/id/11/800/450",
      "https://picsum.photos/id/12/800/450",
      "https://picsum.photos/id/13/800/450"
    ],
    baidu:"https://pan.baidu.com/s/demo001",
    quark:"https://pan.quark.cn/s/demo001",
    steam:"https://store.steampowered.com/app/demo001"
  },
  "2":{
    name:"龙之信条2",
    eng:"Dragon's Dogma 2",
    cover:"https://picsum.photos/id/12/600/400",
    update:"2024‑03‑22",
    version:"v1.0.1",
    tags:["#RPG","#奇幻","#开放世界"],
    desc:"《龙之信条2》是一款奇幻题材开放世界动作角色扮演游戏，玩家作为觉醒者踏上屠龙的冒险旅途。本作最具特色的随从AI系统能够让队友自主进行战斗、探路、拾取道具，高自由度的职业搭配与立体式战斗带来丰富玩法。庞大的奇幻大陆分布着城镇、密林、洞窟与巨型怪物，昼夜循环和动态事件让整个世界充满生机。",
    shots:[
      "https://picsum.photos/id/12/800/450",
      "https://picsum.photos/id/13/800/450",
      "https://picsum.photos/id/14/800/450"
    ],
    baidu:"https://pan.baidu.com/s/demo002",
    quark:"https://pan.quark.cn/s/demo002",
    steam:"https://store.steampowered.com/app/demo002"
  },
  "3":{
    name:"怪物猎人：荒野",
    eng:"Monster Hunter Wilds",
    cover:"https://picsum.photos/id/13/600/400",
    update:"2025‑02‑28",
    version:"v1.0.3",
    tags:["#动作","#狩猎","#多人"],
    desc:"《怪物猎人：荒野》是经典狩猎系列全新续作，游戏打造出广阔且生态逼真的荒野环境，多种巨型怪物拥有独特的行为模式与攻击特点。玩家可以挑选不同武器，搭配装备与道具进行狩猎，支持多人组队协作。环境会随天气与季节发生变化，怪物之间存在捕食争斗，真实的生态系统给狩猎带来更多变数与挑战。",
    shots:[
      "https://picsum.photos/id/13/800/450",
      "https://picsum.photos/id/14/800/450",
      "https://picsum.photos/id/21/800/450"
    ],
    baidu:"https://pan.baidu.com/s/demo003",
    quark:"https://pan.quark.cn/s/demo003",
    steam:"https://store.steampowered.com/app/demo003"
  },
  "5":{
    name:"黑神话：悟空",
    eng:"Black Myth: Wukong",
    cover:"https://picsum.photos/id/21/600/400",
    update:"2024‑08‑20",
    version:"v1.0.4",
    tags:["#动作","#神话","#单人"],
    desc:"《黑神话：悟空》取材于古典名著西游记，是一款国产第三人称动作角色扮演游戏。玩家将踏上充满妖魔鬼怪的西行之路，依靠身法、法术与棍法迎战各路妖王。游戏画面精良，场景氛围感浓厚，拥有多种变身技能，战斗手感扎实，融合东方神话美学，打造出一个苍凉诡谲的西游世界。",
    shots:[
      "https://picsum.photos/id/21/800/450",
      "https://picsum.photos/id/22/800/450",
      "https://picsum.photos/id/23/800/450"
    ],
    baidu:"https://pan.baidu.com/s/demo005",
    quark:"https://pan.quark.cn/s/demo005",
    steam:"https://store.steampowered.com/app/demo005"
  }
};

//获取url参数gid
function getUrlParam(name){
  let u = new URL(window.location.href);
  return u.searchParams.get(name);
}
const gid = getUrlParam("gid");
const data = gameDB[gid];

if(!data){
  document.body.innerHTML = `<div class="p-10 text-center"><h2>游戏不存在</h2><a href="index.html">返回首页</a></div>`;
}else{
  document.getElementById("breadName").innerText = data.name;
  document.getElementById("detailTitle").innerText = data.name;
  document.getElementById("detailEng").innerText = data.eng;
  document.getElementById("detailCover").src = data.cover;
  document.getElementById("detailUpdate").innerText = data.update;
  document.getElementById("detailVersion").innerText = data.version;
  document.getElementById("linkBaidu").href = data.baidu;
  document.getElementById("linkBaidu").innerText = data.baidu;
  document.getElementById("linkQuark").href = data.quark;
  document.getElementById("linkQuark").innerText = data.quark;
  document.getElementById("linkSteam").href = data.steam;
  document.getElementById("linkSteam").innerText = data.steam;
  document.getElementById("detailDesc").innerText=data.desc;

  //渲染标签
  let tagHtml = "";
  data.tags.forEach(t=>{
    tagHtml += `<span class="bg-gray-200 px-2 py-1 text-xs rounded">${t}</span>`
  })
  document.getElementById("tagWrap").innerHTML = tagHtml;

  //渲染截图
  let shotHtml = "";
  data.shots.forEach(s=>{
    shotHtml += `<img src="${s}" class="screenshot-img rounded w-full">`
  })
  document.getElementById("shotWrap").innerHTML = shotHtml;
}
</script>
</body>
</html>
